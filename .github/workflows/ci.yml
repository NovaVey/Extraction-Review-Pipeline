name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches package.json's "engines" field (>=20 <21) — the one version this
      # project actually declares support for, even though later Node versions have
      # been used without issue during development. CI checks the declared contract,
      # not just whatever happens to work locally.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install

      - run: npm run typecheck

      # No secrets needed: every test file stubs DATABASE_URL/SUPABASE_*/
      # ANTHROPIC_API_KEY with fake local values before importing app code
      # specifically so the full suite runs without touching real infrastructure —
      # the same property that's let this suite run identically in an offline
      # sandbox all through development.
      - run: npm run test

      - run: npm run build

      - run: npm run lint --workspace web
